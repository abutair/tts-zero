<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">STFT overlapping windows and FFT bins near 440 Hz</title>
  <desc id="desc">The upper diagram shows three overlapping 46.44 millisecond windows starting 11.61 milliseconds apart. The lower diagram shows a 440 Hz tone between FFT bins 20 and 21, with bin 20 closest.</desc>
  <style>
    :root { color-scheme: light dark; }
    .background { fill: #ffffff; }
    .text { fill: #172033; font: 16px system-ui, sans-serif; }
    .heading { fill: #172033; font: 600 20px system-ui, sans-serif; }
    .small { fill: #526078; font: 14px system-ui, sans-serif; }
    .axis { stroke: #a8b1c2; stroke-width: 2; }
    .grid { stroke: #d7dce5; stroke-width: 1; }
    .wave { fill: none; stroke: #2563eb; stroke-width: 3; }
    .frame { fill: #2563eb; fill-opacity: .12; stroke: #2563eb; stroke-width: 2; }
    .frame-center { stroke: #2563eb; stroke-width: 1; stroke-dasharray: 5 5; }
    .bar { fill: #2563eb; }
    .target { stroke: #c2415d; stroke-width: 3; stroke-dasharray: 7 5; }
    .target-text { fill: #a62f49; font: 600 16px system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #111827; }
      .text, .heading { fill: #f3f4f6; }
      .small { fill: #bdc5d4; }
      .axis { stroke: #667085; }
      .grid { stroke: #344054; }
      .wave, .frame { stroke: #70a5ff; }
      .frame { fill: #70a5ff; fill-opacity: .16; }
      .frame-center { stroke: #70a5ff; }
      .bar { fill: #70a5ff; }
      .target { stroke: #ff7894; }
      .target-text { fill: #ff9caf; }
    }
  </style>

  <rect class="background" width="960" height="560" rx="16"/>

  <text class="heading" x="70" y="42">Overlapping STFT frames</text>
  <text class="small" x="70" y="68">win_length = 1024 samples (46.44 ms), hop_length = 256 samples (11.61 ms)</text>

  <line class="axis" x1="70" y1="155" x2="890" y2="155"/>
  <path class="wave" d="M70 128 C82 88 94 88 106 128 S130 168 142 128 S166 88 178 128 S202 168 214 128 S238 88 250 128 S274 168 286 128 S310 88 322 128 S346 168 358 128 S382 88 394 128 S418 168 430 128 S454 88 466 128 S490 168 502 128 S526 88 538 128 S562 168 574 128 S598 88 610 128 S634 168 646 128 S670 88 682 128 S706 168 718 128 S742 88 754 128 S778 168 790 128 S814 88 826 128 S850 168 862 128 S886 88 890 111"/>

  <g class="small" text-anchor="middle">
    <line class="grid" x1="70" y1="150" x2="70" y2="162"/><text x="70" y="181">0 ms</text>
    <line class="grid" x1="275" y1="150" x2="275" y2="162"/><text x="275" y="181">20 ms</text>
    <line class="grid" x1="480" y1="150" x2="480" y2="162"/><text x="480" y="181">40 ms</text>
    <line class="grid" x1="685" y1="150" x2="685" y2="162"/><text x="685" y="181">60 ms</text>
    <line class="grid" x1="890" y1="150" x2="890" y2="162"/><text x="890" y="181">80 ms</text>
  </g>

  <g>
    <rect class="frame" x="70" y="202" width="476" height="34" rx="5"/>
    <line class="frame-center" x1="308" y1="202" x2="308" y2="236"/>
    <text class="text" x="82" y="225">Frame 0</text>

    <rect class="frame" x="189" y="246" width="476" height="34" rx="5"/>
    <line class="frame-center" x1="427" y1="246" x2="427" y2="280"/>
    <text class="text" x="201" y="269">Frame 1</text>

    <rect class="frame" x="308" y="290" width="476" height="34" rx="5"/>
    <line class="frame-center" x1="546" y1="290" x2="546" y2="324"/>
    <text class="text" x="320" y="313">Frame 2</text>
  </g>

  <text class="heading" x="70" y="378">440 Hz between discrete FFT bins</text>
  <text class="small" x="70" y="404">bin spacing = 22050 / 1024 = 21.53 Hz</text>

  <line class="axis" x1="70" y1="500" x2="890" y2="500"/>
  <g class="small" text-anchor="middle">
    <line class="grid" x1="132" y1="420" x2="132" y2="508"/><text x="132" y="528">bin 18</text><text x="132" y="548">387.6 Hz</text>
    <line class="grid" x1="276" y1="420" x2="276" y2="508"/><text x="276" y="528">bin 19</text><text x="276" y="548">409.1 Hz</text>
    <line class="grid" x1="423" y1="420" x2="423" y2="508"/><text x="423" y="528">bin 20</text><text x="423" y="548">430.7 Hz</text>
    <line class="grid" x1="570" y1="420" x2="570" y2="508"/><text x="570" y="528">bin 21</text><text x="570" y="548">452.2 Hz</text>
    <line class="grid" x1="717" y1="420" x2="717" y2="508"/><text x="717" y="528">bin 22</text><text x="717" y="548">473.7 Hz</text>
    <line class="grid" x1="864" y1="420" x2="864" y2="508"/><text x="864" y="528">bin 23</text><text x="864" y="548">495.3 Hz</text>
  </g>

  <rect class="bar" x="112" y="493" width="40" height="7" rx="3"/>
  <rect class="bar" x="256" y="470" width="40" height="30" rx="3"/>
  <rect class="bar" x="403" y="424" width="40" height="76" rx="3"/>
  <rect class="bar" x="550" y="447" width="40" height="53" rx="3"/>
  <rect class="bar" x="697" y="486" width="40" height="14" rx="3"/>
  <rect class="bar" x="844" y="495" width="40" height="5" rx="3"/>

  <line class="target" x1="487" y1="410" x2="487" y2="508"/>
  <text class="target-text" x="487" y="400" text-anchor="middle">440 Hz target</text>
</svg>
